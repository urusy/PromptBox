# 開発用設定（本番のportsを上書きするため、frontendを完全に再定義）
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_TARGET=http://backend-rs:8000
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend-rs
    networks:
      - app-network