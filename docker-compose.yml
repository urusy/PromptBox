services:
  # ===========================================
  # Frontend (Nginx + React)
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./storage:/app/storage:ro
    depends_on:
      - backend
      - backend-rs
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # Backend (FastAPI)
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./import:/app/import
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - SECRET_KEY=${SECRET_KEY}
      - IMPORT_PATH=/app/import
      - STORAGE_PATH=/app/storage
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
      - DEBUG=${DEBUG:-true}
      - GELBOORU_API_KEY=${GELBOORU_API_KEY:-}
      - GELBOORU_USER_ID=${GELBOORU_USER_ID:-}
      - IMPORT_SKIP_PATTERNS=${IMPORT_SKIP_PATTERNS:-xyz_grid}
      - IMPORT_MAX_ATTEMPTS=${IMPORT_MAX_ATTEMPTS:-5}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - app-network

  # ===========================================
  # Backend (Rust / axum) — strangler-fig rewrite
  # Shares the same DB / import / storage as the FastAPI backend. Runs on a
  # separate port so both can coexist during migration. The import worker is
  # off by default (RS_WATCHER_ENABLED=true to let Rust own imports).
  # ===========================================
  backend-rs:
    build:
      context: ./backend-rs
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_RS_PORT:-8001}:8000"
    volumes:
      - ./import:/app/import
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - SECRET_KEY=${SECRET_KEY}
      - IMPORT_PATH=/app/import
      - STORAGE_PATH=/app/storage
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
      - DEBUG=${DEBUG:-true}
      - GELBOORU_API_KEY=${GELBOORU_API_KEY:-}
      - GELBOORU_USER_ID=${GELBOORU_USER_ID:-}
      - WATCHER_ENABLED=${RS_WATCHER_ENABLED:-false}
      - IMPORT_SKIP_PATTERNS=${IMPORT_SKIP_PATTERNS:-xyz_grid}
      - IMPORT_MAX_ATTEMPTS=${IMPORT_MAX_ATTEMPTS:-5}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 64M
    networks:
      - app-network

  # ===========================================
  # Database (PostgreSQL)
  # ===========================================
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=32MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
      -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c logging_collector=on
      -c log_statement=none
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: