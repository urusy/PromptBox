# 上流プロキシ（Cloudflare Tunnel の cloudflared 等）が付けた X-Forwarded-Proto を
# 尊重し、無ければ自分の $scheme を使う。
# $scheme で無条件に上書きすると、cloudflared → nginx が平文HTTPのため HTTPS 経由の
# アクセスまで http と伝わり、backend-rs がセッション Cookie の Secure 判定を誤る。
map $http_x_forwarded_proto $promptbox_forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # gzip圧縮
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPAルーティング
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API プロキシ（backend-rs / axum）
    location /api/ {
        proxy_pass http://backend-rs:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $promptbox_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # 画像ストレージ（backend-rs がオブジェクトストレージからストリーミング配信）
    # Cache-Control は backend-rs 側が付与する
    # ^~ を使用して正規表現ロケーションより優先させる
    location ^~ /storage/ {
        proxy_pass http://backend-rs:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $promptbox_forwarded_proto;
    }

    # 静的アセットのキャッシュ
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}