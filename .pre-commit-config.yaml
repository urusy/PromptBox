# Pre-commit hooks configuration
# https://pre-commit.com/

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/.*\.snap$
      - id: end-of-file-fixer
        exclude: ^frontend/.*\.snap$
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Backend (Rust) - Clippy
  # 型検査・テストは CI（cargo clippy / cargo test）が本番のゲート。
  # ここは commit 前の速い足切りに留める。
  - repo: local
    hooks:
      - id: clippy
        name: clippy
        entry: bash -c 'cd backend-rs && cargo clippy --all-targets -- -D warnings'
        language: system
        files: ^backend-rs/.*\.rs$
        pass_filenames: false

  # Frontend - Prettier formatter
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/src/
        types_or: [javascript, jsx, ts, tsx, json, css]
        additional_dependencies:
          - prettier@3.2.0

  # Frontend - ESLint
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        files: Dockerfile

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, relaxed]
        exclude: ^frontend/

# CI settings
ci:
  autofix_commit_msg: "style: auto-fix by pre-commit hooks"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  skip: [eslint, clippy]  # Skip hooks that require project setup
